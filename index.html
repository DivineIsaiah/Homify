<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homify</title>
    <link rel="stylesheet" href="./CSS/main.css">
</head>
<body>
    <header id="index-header" class="header">
        <nav class="nav-bar container">
            <div class="logo-box">
                <p class="logo-txt">Homify</p>
            </div>

            <div class="nav-links">
                <ul class="nav-links-list"> 
                    <li><a class="nav-link" href="">Buy</a></li>
                    <li><a class="nav-link" href="">Sell</a></li>
                    <li><a class="nav-link" href="">Rent</a></li>
                    <li><a class="nav-link" href="">Properties</a></li>
                </ul>
            </div>

            <div class="nav-btns">

                <a class="nav-btn agent-btn" href="">
                    Speak With Agent
                    <img class="visit-img" src="./assets/icons/buttons/phone-green.svg" alt="">
                </a>
                <a class="nav-btn visit-btn" href="">
                    Schedule a Visit
                    <img class="visit-img" src="./assets/icons/buttons/arrow-right-white.svg" alt="">
                </a>

            </div>
        </nav>
    </header>

    <main id="index-main">

        <section class="index-hero hero">
            <div class="index-bg">

                <div class="container index-bg-in">
                    <h1 class="head-txt">
                        Discover a Place to Live
                    </h1>

                    <div class="index-cont-bx">
                        <div class="index-hero-btns">
                            <a class="index-hero-btn" href="">Buy</a>
                            <a class="index-hero-btn" href="">Sell</a>
                            <a class="index-hero-btn" href="">Rent</a>
                        </div>

                        <div class="index-inpt">
                            <input type="search" name="search" id="search" placeholder="home search" aria-placeholder="search for a home">
                            <div class="input-srch">
                                <img class="srch-img" src="./assets/icons/buttons/search-white.svg" alt="">
                            </div>
                        </div>
                    </div>

                </div>

            </div>

                

        </section>

    </main>

    <footer class="">

    </footer>
    
</body>
</html>
