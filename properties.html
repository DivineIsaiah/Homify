<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homify Properties</title>
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>

    <header id="index-header" class="header">
        <nav class="nav-bar container">
            <div class="logo-box">
                <p class="logo-txt">Homify</p>
            </div>

            <div class="index-inpt">
                <input class="search-inpt" type="search" name="search" id="search" placeholder="home search" aria-placeholder="search for a home">
                <div class="input-srch">
                    <img class="srch-img" src="./assets/icons/buttons/search-white.svg" alt="">
                </div>
            </div>

            <div class="nav-links">
                <ul class="nav-links-list"> 
                    <li><a class="nav-link" href="">Buy</a></li>
                    <li><a class="nav-link" href="">Sell</a></li>
                    <li><a class="nav-link" href="">Rent</a></li>
                    <li><a class="nav-link" href="">Properties</a></li>
                </ul>
            </div>

            <div class="nav-btns">

                <a class="nav-btn agent-btn" href="">
                    Speak With Agent
                    <img class="visit-img" src="./assets/icons/buttons/phone-green.svg" alt="">
                </a>
                <a class="nav-btn visit-btn" href="">
                    Schedule a Visit
                    <img class="visit-img" src="./assets/icons/buttons/arrow-right-white.svg" alt="">
                </a>

            </div>
        </nav>
    </header>

    <footer></footer>

</body>
</html>
